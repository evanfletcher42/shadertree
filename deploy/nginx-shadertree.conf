server {
    listen 80;
    server_name _;
    client_max_body_size 16M;

    location /static/ {
        alias /var/www/shadertree/static/;
    }

    location / {
        proxy_set_header Host $http_host;
        # Client IP, used by the site for logging and bans
        proxy_set_header X-Real-IP $remote_addr;

        proxy_pass http://127.0.0.1:8000;
    }
}
