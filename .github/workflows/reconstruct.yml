# Build-only check of the reconstruction solver. Manual trigger only (Actions > reconstruct > Run workflow).
name: reconstruct

on: workflow_dispatch

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - run: New-Item -ItemType Directory -Force vcpkg-cache
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('reconstruct/vcpkg.json') }}
      - working-directory: reconstruct
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows
          if ( $LASTEXITCODE -ne 0 ) { exit 1 }
          cmake --build --preset windows-release
          if ( $LASTEXITCODE -ne 0 ) { exit 1 }
          # No arguments: prints usage and exits 1. Anything else means it failed to load.
          build/windows/Release/ledreconstruct.exe
          if ( $LASTEXITCODE -ne 1 ) { exit 1 }
          exit 0

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libceres-dev libopencv-dev libeigen3-dev libjsoncpp-dev libcxxopts-dev
      - working-directory: reconstruct
        run: |
          cmake --preset linux
          cmake --build --preset linux -j
          ./build/linux/ledreconstruct || test $? -eq 1

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel cmake ceres-solver opencv qt6-base vtk hdf5 eigen jsoncpp cxxopts
      - uses: actions/checkout@v4
      - working-directory: reconstruct
        run: |
          cmake --preset linux
          cmake --build --preset linux -j
          ./build/linux/ledreconstruct || test $? -eq 1
