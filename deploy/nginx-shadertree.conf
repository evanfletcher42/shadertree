server {
    listen 80;
    server_name _;

    location /static/ {
        alias /var/www/shadertree/static/;
    }

    location / {
        proxy_set_header Host $http_host;
        # The site logs and bans by this address (shader_app/utils.py)
        proxy_set_header X-Real-IP $remote_addr;

        proxy_pass http://unix:/var/www/shadertree/shadertree.sock;
    }
}
