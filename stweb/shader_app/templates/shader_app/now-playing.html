{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Shadertree: Now Playing</title>
    <link rel="stylesheet" href="{% static 'shader_app/styles.css' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'shader_app/favicon.ico' %}" >
    <style>
        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            text-align: center;
            width: 100%;
        }

        .section {
            width: 100%;
        }

        .top-section h2 {
            font-size: 6em;
            font-weight: normal;
            color: #606060; 
            margin-top: 0.25em;
            margin-bottom: -1em;
        }

        .title-section h1 {
            font-size: 8em;
            font-weight: bold;
            margin-bottom: -0.25em;
        }

        .author-section {
            font-size: 4em;
            margin-bottom: -1em;
        }

        .upnext-section {
            font-size: 2.5em;
            color: #A0A0A0;
        }

        .upnext-section button.playNowButton {
            font-size: 0.6em;
            vertical-align: middle;
        }

        .bottom-section p {
            font-size: 4em;
        }

        .bottom-section a {
            font-size: 4em;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Top Section -->
        <div class="section top-section">
            <h2>Now Playing</h2>
        </div>

        <!-- Title Section -->
        <div class="section title-section">
            <h1 id="title">Default Title</h1>
            <p class="author-section" id="author">By Default Author</p>
        </div>

        <!-- Up Next Section -->
        <div class="section upnext-section" id="upNext"></div>

        <!-- Bottom Section -->
        <div class="section bottom-section">
            <p>Run Your Own Shader On This Tree:</p>

            <div style="margin-top: 0.75em;">
                <select id="shaderSelect" style="font-size: 2.5em; padding: 0.2em 0.4em; max-width: 80vw; width:auto; background-color:#A0A0A0">
                    <option value="">Select a shader…</option>
                </select>
                <button id="playNowBtn" style="font-size: 2.5em; padding: 0.2em 0.6em; margin-left: 0.4em;">
                    Play Now
                </button>
            </div>

            <a href="/">shadertree.valve.org</a>
        </div>
    </div>

<script src="{% static 'shader_app/playlist.js' %}"></script>
<script>
    const UP_NEXT_COUNT = 3;

    function showPlaylist(data) {
        const playing = data.now_playing || {};
        document.getElementById('title').textContent = playing.title || 'Title Unavailable';
        document.getElementById('author').textContent = `By ${playing.author || 'Author Unavailable'}`;

        const upNext = document.getElementById('upNext');
        upNext.replaceChildren();
        for (const s of data.upcoming.slice(0, UP_NEXT_COUNT)) {
            const line = document.createElement('div');
            line.textContent = `${s.eta} ${s.title} by ${s.author} `.trimStart();
            line.appendChild(makePlayNowButton(s.ident));
            upNext.appendChild(line);
        }
    }

    async function loadShaderDropdown() {
        try {
            const response = await fetch('/shader_list/');
            if (!response.ok) throw new Error(`Response status: (${response.status})`);
            const shaders = await response.json(); // [{title, author, ident, is_playable}, ...]

            const sel = document.getElementById('shaderSelect');
            const previous = sel.value; // preserve selection if it still exists

            // Keep placeholder option
            sel.length = 1;

            // Frontend filter: playable only
            const playable = shaders.filter(s => s.is_playable);

            for (const s of playable) {
                const opt = document.createElement('option');
                opt.value = s.ident;
                opt.textContent = s.title; // names only
                sel.appendChild(opt);
            }

            // restore selection if still present
            if (previous) {
                const stillThere = Array.from(sel.options).some(o => o.value === previous);
                if (stillThere) sel.value = previous;
            }
        } catch (error) {
            console.error('Failed to load shader list:', error);
        }
    }

    function playSelectedShader() {
        const ident = document.getElementById('shaderSelect').value;
        if (ident)
            playNow(ident);
    }

    document.addEventListener('DOMContentLoaded', () => {
        pollPlaylist(showPlaylist);
        loadShaderDropdown();

        setInterval(loadShaderDropdown, 5000);

        document.getElementById('playNowBtn').addEventListener('click', playSelectedShader);
    });
</script>
</body>
</html>
